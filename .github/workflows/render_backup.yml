name: Backup Render DB to Google Drive (Windows)

on:
  schedule:
    - cron: '0 2 * * *'  # Každý deň o 2:00 UTC
  workflow_dispatch:  # Pridané pre manuálne spustenie

jobs:
  backup:
    runs-on: windows-latest  # Použitie Windows runnera

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install PostgreSQL client
        run: choco install postgresql13 -y  # Inštalácia PostgreSQL cez Chocolatey

      - name: Backup database
        run: |
          $env:PGPASSWORD = "${{ secrets.DB_PASSWORD }}"
          pg_dump -h ${{ secrets.DB_HOST }} -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -F c -f backup.dump

      - name: Compress backup
        run: Compress-Archive -Path backup.dump -DestinationPath backup.zip

      - name: Install rclone
        run: |
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "rclone.zip"
          Expand-Archive -Path "rclone.zip" -DestinationPath "rclone"
          Move-Item -Path "rclone\rclone-*-windows-amd64\rclone.exe" -Destination "C:\Windows\System32\rclone.exe"
          rclone version  # Overenie inštalácie

      - name: Set up rclone
        run: |
          $rcloneConfig = "$env:USERPROFILE\.config\rclone\rclone.conf"
          New-Item -ItemType Directory -Path (Split-Path $rcloneConfig) -Force
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("${{ secrets.RCLONE_CONFIG }}")) | Out-File -FilePath $rcloneConfig -Encoding UTF8

      - name: Verify rclone config
        run: |
          $rcloneConfig = "$env:USERPROFILE\.config\rclone\rclone.conf"
          Get-Content $rcloneConfig
          Write-Output "Koniec obsahu rclone.conf"

      - name: Check rclone config
        run: rclone config show  # Overenie, či rclone vidí konfiguráciu

      - name: Create backup directory on Google Drive (ak neexistuje)
        run: rclone mkdir gdrive:zaloha  # Vytvorenie priečinka "zaloha"

      - name: Upload to Google Drive
        run: rclone copy backup.zip gdrive:zaloha/  # Nahratie do priečinka "zaloha"

      - name: Clean up
        run: Remove-Item backup.dump, backup.zip  # Odstránenie lokálnych súborov po nahratí
