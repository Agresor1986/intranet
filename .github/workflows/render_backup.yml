name: Backup Render DB to Google Drive

on:
  schedule:
    - cron: '0 2 * * *'  # Každý deň o 2:00 UTC
  workflow_dispatch:  # Pridané pre manuálne spustenie

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install PostgreSQL client
        run: sudo apt-get install postgresql-client -y

      - name: Backup database
        run: pg_dump -h ${{ secrets.DB_HOST }} -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -F c -f backup.dump
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Compress backup
        run: gzip backup.dump

      - name: Upload to Google Drive using rclone
        uses: rclone/rclone-action@v2  # Použitá verzia v2
        with:
          command: copy
          source: backup.dump.gz
          destination: gdrive:/zaloha/
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
