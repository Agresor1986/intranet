name: Backup Render DB to Google Drive

on:
  schedule:
    - cron: '0 2 * * *'  # Každý deň o 2:00 UTC
  workflow_dispatch:  # Pridané pre manuálne spustenie

jobs:
  backup:
    runs-on: ubuntu-latest  # Použitie Linux runnera

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install PostgreSQL client
        run: sudo apt-get install postgresql-client -y

      - name: Backup database
        run: pg_dump -h ${{ secrets.DB_HOST }} -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -F c -f backup.dump
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Compress backup
        run: gzip backup.dump

      - name: Install rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          cd rclone-*-linux-amd64
          sudo cp rclone /usr/bin/
          sudo chown root:root /usr/bin/rclone
          sudo chmod 755 /usr/bin/rclone
          rclone version  # Overenie inštalácie

      - name: Set up rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 --decode > ~/.config/rclone/rclone.conf

      - name: Verify rclone config
        run: |
          echo "Obsah rclone.conf:"
          cat ~/.config/rclone/rclone.conf
          echo "Koniec obsahu rclone.conf"

      - name: Check rclone config
        run: rclone config show  # Overenie, či rclone vidí konfiguráciu

      - name: Create backup directory on Google Drive (ak neexistuje)
        run: rclone mkdir gdrive:zaloha  # Vytvorenie priečinka "zaloha"

      - name: Upload to Google Drive
        run: rclone copy backup.dump.gz gdrive:zaloha/  # Nahratie do priečinka "zaloha"

      - name: Clean up
        run: rm backup.dump.gz  # Odstránenie lokálneho archívu po nahratí
