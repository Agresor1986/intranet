name: Backup PostgreSQL to MEGA

on:
  workflow_dispatch:  # Tento riadok pridá možnosť manuálneho spustenia
  schedule:
    - cron: "0 0 * * *"  # Automatické spustenie každý deň o polnoci UTC
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL
        run: sudo apt-get install postgresql-client -y

      - name: Dump database
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          pg_dump -h ${{ secrets.DB_HOST }} -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -F c -f backup.dump

      - name: Install MEGA CMD
        run: |
          sudo apt-get update && sudo apt-get install megatools -y

      - name: Upload to MEGA
        env:
          MEGA_USER: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASS: ${{ secrets.MEGA_PASSWORD }}
        run: |
          megals -u "$MEGA_EMAIL" -p "$MEGA_PASSWORD"
          megaput --path /DB_Backups/backup_$(date +%Y-%m-%d).dump backup.dump
