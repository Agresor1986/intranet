name: Backup PostgreSQL to MEGA

on:
  workflow_dispatch:  # Manuálne spustenie
  schedule:
    - cron: "0 0 * * *"  # Spustenie každý deň o polnoci UTC

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Dump PostgreSQL database
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          pg_dump -h ${{ secrets.DB_HOST }} -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -F c -f backup.dump

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Create rclone config directory
        run: |
          mkdir -p ~/.config/rclone

      - name: Configure rclone for MEGA
        run: |
          echo "[mega]" > ~/.config/rclone/rclone.conf
          echo "type = mega" >> ~/.config/rclone/rclone.conf
          echo "user = ${{ secrets.MEGA_EMAIL }}" >> ~/.config/rclone/rclone.conf
          echo "pass = ${{ secrets.MEGA_PASSWORD }}" >> ~/.config/rclone/rclone.conf

      - name: Upload backup to MEGA using rclone
        run: |
          rclone copy backup.dump mega:/Root/backups/ --progress

      - name: Verify upload
        run: |
          rclone lsd mega:/Root/backups/
