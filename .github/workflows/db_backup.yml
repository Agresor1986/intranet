name: Backup PostgreSQL to MEGA

on:
  workflow_dispatch:  # Manuálne spustenie
  schedule:
    - cron: "0 0 * * *"  # Spustenie každý deň o polnoci UTC

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Dump PostgreSQL database
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          pg_dump -h ${{ secrets.DB_HOST }} -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -F c -f backup.dump

      - name: Install MEGA tools
        run: sudo apt-get install -y megatools

      - name: Upload backup to MEGA
        run: |
          megaput --username ${{ secrets.MEGA_EMAIL }} --password ${{ secrets.MEGA_PASSWORD }} backup.dump --path /Root/backups/

      - name: Verify upload
        run: megals --username ${{ secrets.MEGA_EMAIL }} --password ${{ secrets.MEGA_PASSWORD }} /Root/backups/
