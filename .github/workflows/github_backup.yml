name: Backup GitHub Repo to Google Drive

on:
  schedule:
    - cron: '0 3 * * *'  # Každý deň o 3:00 UTC
  workflow_dispatch:  # Pridané pre manuálne spustenie

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Archive repository
        run: tar -czvf repo_backup_$(date +%Y%m%d_%H%M%S).tar.gz .

      - name: Upload to Google Drive using rclone
        uses: rclone/rclone-action@v2  # Použitá verzia v2
        with:
          command: copy
          source: repo_backup_*.tar.gz
          destination: gdrive:/zaloha/
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

      - name: Clean up
        run: rm repo_backup_*.tar.gz
