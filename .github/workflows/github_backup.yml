name: Backup GitHub Repo to Google Drive (Rozdelené časti)

on:
  schedule:
    - cron: '0 3 * * *'  # Každý deň o 3:00 UTC
  workflow_dispatch:  # Pridané pre manuálne spustenie

jobs:
  backup:
    runs-on: ubuntu-latest  # Použitie Linux runnera

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install rclone
        run: |
          echo "Inštalujem rclone..."
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip || { echo "Chyba pri sťahovaní rclone"; exit 1; }
          unzip rclone-current-linux-amd64.zip || { echo "Chyba pri rozbaľovaní rclone"; exit 1; }
          cd rclone-*-linux-amd64
          sudo cp rclone /usr/bin/ || { echo "Chyba pri kopírovaní rclone"; exit 1; }
          sudo chown root:root /usr/bin/rclone || { echo "Chyba pri nastavovaní oprávnení"; exit 1; }
          sudo chmod 755 /usr/bin/rclone || { echo "Chyba pri nastavovaní oprávnení"; exit 1; }
          rclone version || { echo "Chyba pri overovaní inštalácie rclone"; exit 1; }
          echo "Rclone úspešne nainštalované."

      - name: Set up rclone
        run: |
          echo "Nastavujem rclone konfiguráciu..."
          mkdir -p ~/.config/rclone || { echo "Chyba pri vytváraní priečinka pre rclone"; exit 1; }
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 --decode > ~/.config/rclone/rclone.conf || { echo "Chyba pri zápise konfigurácie"; exit 1; }
          echo "Konfigurácia rclone úspešne nastavená."

      - name: Verify rclone config
        run: |
          echo "Overujem rclone konfiguráciu..."
          cat ~/.config/rclone/rclone.conf || { echo "Chyba pri čítaní konfigurácie"; exit 1; }
          echo "Koniec obsahu rclone.conf."

      - name: Check rclone config
        run: |
          echo "Kontrolujem rclone konfiguráciu..."
          rclone config show || { echo "Chyba pri overovaní konfigurácie"; exit 1; }

      - name: Create backup directory on Google Drive (ak neexistuje)
        run: |
          echo "Vytváram priečinok na Google Drive..."
          rclone mkdir gdrive:zaloha || { echo "Chyba pri vytváraní priečinka"; exit 1; }

      - name: Delete backups older than 1 month
        run: |
          echo "Mažem zálohy staršie ako 1 mesiac..."
          rclone delete gdrive:zaloha --min-age 30d --include "*.tar.gz" || { echo "Chyba pri mazaní starých záloh"; exit 1; }
          echo "Staré zálohy úspešne vymazané."

      - name: Archive and upload part 1 (templates, static, media)
        run: |
          echo "Vytváram archív časti 1 (templates, static, media)..."
          tar -czvf repo_backup_part1_$(date +%Y%m%d_%H%M%S).tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='node_modules' \
            --exclude='venv' \
            ./templates ./static ./media || { echo "Chyba pri vytváraní archívu časti 1"; exit 1; }
          echo "Archív časti 1 úspešne vytvorený."

          echo "Nahrávam archív časti 1 na Google Drive..."
          rclone copy repo_backup_part1_*.tar.gz gdrive:zaloha/ || { echo "Chyba pri nahrávaní časti 1"; exit 1; }
          echo "Archív časti 1 úspešne nahraný."

          echo "Čistím lokálne súbory časti 1..."
          rm repo_backup_part1_*.tar.gz || { echo "Chyba pri odstraňovaní súborov časti 1"; exit 1; }
          echo "Čistenie časti 1 dokončené."

      - name: Archive and upload part 2 (Python files)
        run: |
          echo "Vytváram archív časti 2 (Python súbory)..."
          find . -name "*.py" -not -path "./.git/*" -not -path "./__pycache__/*" -not -path "./node_modules/*" -not -path "./venv/*" | tar -czvf repo_backup_part2_$(date +%Y%m%d_%H%M%S).tar.gz -T - || { echo "Chyba pri vytváraní archívu časti 2"; exit 1; }
          echo "Archív časti 2 úspešne vytvorený."

          echo "Nahrávam archív časti 2 na Google Drive..."
          rclone copy repo_backup_part2_*.tar.gz gdrive:zaloha/ || { echo "Chyba pri nahrávaní časti 2"; exit 1; }
          echo "Archív časti 2 úspešne nahraný."

          echo "Čistím lokálne súbory časti 2..."
          rm repo_backup_part2_*.tar.gz || { echo "Chyba pri odstraňovaní súborov časti 2"; exit 1; }
          echo "Čistenie časti 2 dokončené."

      - name: Archive and upload part 3 (staticfiles)
        run: |
          echo "Vytváram archív časti 3 (staticfiles)..."
          tar -czvf repo_backup_part3_$(date +%Y%m%d_%H%M%S).tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='node_modules' \
            --exclude='venv' \
            ./staticfiles || { echo "Chyba pri vytváraní archívu časti 3"; exit 1; }
          echo "Archív časti 3 úspešne vytvorený."

          echo "Nahrávam archív časti 3 na Google Drive..."
          rclone copy repo_backup_part3_*.tar.gz gdrive:zaloha/ || { echo "Chyba pri nahrávaní časti 3"; exit 1; }
          echo "Archív časti 3 úspešne nahraný."

          echo "Čistím lokálne súbory časti 3..."
          rm repo_backup_part3_*.tar.gz || { echo "Chyba pri odstraňovaní súborov časti 3"; exit 1; }
          echo "Čistenie časti 3 dokončené."

      - name: Archive and upload part 4 (zvyšné súbory)
        run: |
          echo "Vytváram archív časti 4 (zvyšné súbory)..."
          tar -czvf repo_backup_part4_$(date +%Y%m%d_%H%M%S).tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='node_modules' \
            --exclude='venv' \
            --exclude='./templates/*' \
            --exclude='./static/*' \
            --exclude='./media/*' \
            --exclude='./staticfiles/*' \
            --exclude='*.py' \
            --exclude='*.log' \
            --exclude='*.tmp' \
            --exclude='*.cache' \
            --ignore-failed-read \
            . || { echo "Chyba pri vytváraní archívu časti 4"; exit 1; }
          echo "Archív časti 4 úspešne vytvorený."

          echo "Nahrávam archív časti 4 na Google Drive..."
          rclone copy repo_backup_part4_*.tar.gz gdrive:zaloha/ || { echo "Chyba pri nahrávaní časti 4"; exit 1; }
          echo "Archív časti 4 úspešne nahraný."

          echo "Čistím lokálne súbory časti 4..."
          rm repo_backup_part4_*.tar.gz || { echo "Chyba pri odstraňovaní súborov časti 4"; exit 1; }
          echo "Čistenie časti 4 dokončené."