name: Backup GitHub Repo to Google Drive

on:
  schedule:
    - cron: '0 3 * * *'  # Každý deň o 3:00 UTC
  workflow_dispatch:  # Pridané pre manuálne spustenie

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Archive repository
        run: tar -czvf repo_backup_$(date +%Y%m%d_%H%M%S).tar.gz .

      - name: Install rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          cd rclone-*-linux-amd64
          sudo cp rclone /usr/bin/
          sudo chown root:root /usr/bin/rclone
          sudo chmod 755 /usr/bin/rclone
          rclone version  # Overenie inštalácie

      - name: Set up rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

      - name: Upload to Google Drive
        run: rclone copy repo_backup_*.tar.gz gdrive:/zaloha/

      - name: Clean up
        run: rm repo_backup_*.tar.gz  # Odstránenie lokálneho archívu po nahratí
