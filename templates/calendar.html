{% extends 'base.html' %}
{% block title %}Kalendár{% endblock %}
{% block content %}
<style>
body {
    background-color: #7A9BAF;
    color: #2C3E50;
    margin: 0;
    padding: 0;
}
a {
    color: white;
    text-decoration: none;
}

ul, .calendar td ul, .calendar td li {
    list-style-type: none;
    padding: 0;
    margin: 0;
    font-weight: bold;
}

.calendar-container {
    font-family: 'Lato', sans-serif;
    background-color: #7A9BAF;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    min-height: 100vh;
    box-sizing: border-box;
}

.calendar {
    position: relative;
    width: 100%;
    max-width: 1200px;
    font-size: 12px;
    background-color: white;
    border: 10px solid #ddd;
    border-radius: 5px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    border-collapse: collapse;
    padding: 0;
    table-layout: fixed;
}

.calendar tr, .calendar td {
    border: 1px solid #ccc;
    vertical-align: top;
}

.calendar th {
    padding: 8px;
    text-align: center;
    font-size: 16px;
    background-color: #f8f9fa;
    color: #343a40;
}

.calendar td {
    width: 14.28%; /* 100% / 7 days */
    height: 100px;
    padding: 5px;
    text-align: left;
    position: relative;
    box-sizing: border-box;
}

.calendar td .date {
    font-size: 14px;
    color: #6c757d;
    position: relative;
    top: 0px;
    left: 2px;
}

.calendar td .event {
    position: absolute;
    top: 20px;
    left: 0;
    width: calc(100% - 10px);
    padding: 5px;
    border-radius: 5px;
    color: white;
    font-size: 12px;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin: 2px 5px;
}

.btn {
    transition: background-color 0.3s ease, transform 0.3s ease;
    border-radius: 5px;
    display: inline-block;
    background-color: #93BFCF;
    color: #2C3E50;
    padding: 13px;
    text-align: center;
    margin: 5px;
    text-decoration: none;
    font-size: 17px;
}

.btn:hover {
    background-color: #6096B4;
    color: white;
    transform: scale(1.05);
}

.clearfix {
    width: 100%;
    max-width: 1200px;
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.left {
    margin-right: auto;
    margin-left: 0px; 
}

.right {
    margin-left: auto;
    margin-right: 0px; 
}

.event {
    margin-right: 10px; 
}

/* Responzívne štýly */
@media (max-width: 768px) {
    .calendar td {
        height: 80px;
        font-size: 11px;
    }
    
    .calendar th {
        font-size: 14px;
        padding: 5px;
    }
    
    .calendar td .date {
        font-size: 12px;
    }
    
    .calendar td .event {
        font-size: 10px;
        top: 15px;
    }
    
    .btn {
        padding: 10px;
        font-size: 14px;
        margin: 3px;
    }
    
    .clearfix {
        flex-direction: column;
        align-items: center;
    }
    
    .left, .right, .event {
        margin: 5px 0;
    }
}

@media (max-width: 480px) {
    .calendar td {
        height: 60px;
        font-size: 10px;
    }
    
    .calendar th {
        font-size: 12px;
    }
    
    .calendar td .date {
        font-size: 10px;
    }
    
    .calendar-container {
        padding: 10px;
    }
}
</style>
{% if request.user.is_authenticated %}
    <div class="calendar-container">
        <div class="clearfix">
            <!-- Odkaz na predchádzajúci mesiac -->
            <a class="btn left" href="{% url 'cal:calendar' %}?{{ prev_month }}"> Minulý mesiac </a>
            <!-- Odkaz na stránku na vytvorenie novej udalosti -->
            <a href="{% url 'cal:event_new' %}" class="btn event">Vytvoriť novú udalosť</a>
            <!-- Odkaz na nasledujúci mesiac -->
            <a class="btn right" href="{% url 'cal:calendar' %}?{{ next_month }}"> Budúci mesiac </a>
        </div>
        <!-- Zobrazenie vykresleného kalendára -->
        {{ calendar }}
    </div>
{% else %}
    <p>Please log in.</p>
{% endif %}
{% endblock %}
