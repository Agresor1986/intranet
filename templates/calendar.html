{% extends 'base.html' %}
{% block title %}Kalendár{% endblock %}
{% block content %}
<style>
body {
    background-color: #7A9BAF;
    color: #2C3E50;
}
a {
    color: white ;
    text-decoration: none ;
}

ul, .calendar td ul, .calendar td li {
    list-style-type: none;
    padding: 0;
    margin: 0;
    font-weight: bold;
}

.calendar-container {
    font-family: 'Lato', sans-serif;
    background-color: #7A9BAF;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 96.9%;
    height:94.3vh;
}

.calendar {
    position: relative;
    width: 100%;
    font-size: 12px;
    background-color: white;
    border: 10px solid #ddd;
    border-radius: 5px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    border-collapse: collapse;
    padding: 0;
    height:100%;
}

.calendar tr, .calendar td {
    border: 1px solid #ccc;
    vertical-align: top;
}

.calendar th {
    padding: 8px;
    text-align: center;
    font-size: 16px;
    background-color: #f8f9fa;
    color: #343a40;
}

.calendar td {
    width: 100px;
    height: 90px;
    padding: 5px;
    text-align: left;
    position: relative;
    min-height: 80px;
}

.calendar td .date {
    font-size: 14px;
    color: #6c757d;
    position: relative;
    top: 0px;
    left: 2px;
}

.calendar td .event {
    position: absolute;
    top: 20px;
    left: 0;
    width: calc(100% - 10px);
    padding: 5px;
    border-radius: 5px;
    color: white;
    font-size: 12px;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin: 2px 5px;
}

.btn {
    transition: background-color 0.3s ease, transform 0.3s ease;
    border-radius: 5px;
    display: inline-block;
    background-color: #93BFCF;
    color: #2C3E50;
    padding: 13px;
    text-align: center;
    margin: 5px;
    text-decoration: none;
    font-size: 17px;
}

.btn:hover {
    background-color: #6096B4;
    color: white;
    transform: scale(1.05);
}

.clearfix {
    width: 100%;
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.left {
    margin-right: auto;
    margin-left: 0px; 
}

.right {
    margin-left: auto;
    margin-right: 0px; 
}

.event {
    margin-right: 10px; 
}
</style>
{% if request.user.is_authenticated %}
    <div class="calendar-container">
        <div class="clearfix">
            <a class="btn left" href="{% url 'cal:calendar' %}?{{ prev_month }}"> Minulý mesiac </a>
            <a href="{% url 'cal:event_new' %}" class="btn event">Vytvoriť novú udalosť</a>
            <a class="btn right" href="{% url 'cal:calendar' %}?{{ next_month }}"> Budúci mesiac </a>
        </div>
        {{ calendar }}
    </div>
{% else %}
    <p>Please log in.</p>
{% endif %}
{% endblock %}
