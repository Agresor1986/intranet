{% load static %}
<!DOCTYPE html>
<html lang="sk">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.png' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prihlásenie</title>
    <style>
        body {
            background-color: #BCCCDC;
            margin: 0;
            font-family: 'Lato', sans-serif;
        }

        .centered-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .logo img {
            max-width: 120px;
            margin-bottom: 20px;
        }

        .login-form-container {
            font-size: 18px;
            background-color: #FFFFFF;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .login-form-container h2 {
            margin-bottom: 20px;
            color: #2C3E50;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #BDC3C7;
            box-sizing: border-box;

        }

        .btn-submit {
            font-family: 'Lato', sans-serif;
            background-color: #6096B4;
            color: #FFFFFF;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #93BFCF;
            transform: scale(1.05);
        }
        .form-objects {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 {
            margin-top:0px;
        }
    </style>
</head>
<body>
    <div class="centered-container">
        <div class="logo">
            <img src="{% static 'images/logo-firmy.png' %}" alt="Logo">
        </div>

        <div class="login-form-container">
            <h2>Vitaje späť!</h2>
            <form method="post" class="form-objects">
                {% csrf_token %}
                
                <div>
                    <label for="{{ form.username.id_for_label }}">Užívateľské meno:</label>
                    {{ form.username }}
                </div>
                
                <div>
                    <label for="{{ form.password.id_for_label }}">Prihlasovacie heslo:</label>
                    {{ form.password }}
                </div>
            
                <button type="submit" class="btn-submit"><strong>Prihlásiť sa</strong></button>
            </form>
            
        </div>
    </div>
</body>
</html>
