{% extends 'base.html' %}
{% block title %}Vložiť dokument{% endblock %}
{% load static %}
{% block content %}
<style>
    .upload-documents {
        display: flex;
        justify-content: center;
        padding: 20px;
    }
    .upload-container {
        border: 4px solid #7A9BAF;
        font-family: 'Lato', sans-serif;
        color: #2C3E50;
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        width: 350px;
        text-align: center;
    }
    h1 {
        font-size: 24px;
        margin-bottom: 20px;
    }
    .form-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 15px;
    }
    .form-group label {
        font-weight: bold;
        margin-bottom: 5px;
    }
    .btn-container {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: 20px;
    }
    .btn {
        transition: background-color 0.3s ease, transform 0.3s ease;
        border-radius: 5px;
        background-color: #93BFCF;
        color: #2C3E50;
        padding: 10px 15px;
        text-align: center;
        text-decoration: none;
        font-size: 16px;
        cursor: pointer;
        border: none;
    }
    .btn:hover {
        background-color: #6096B4;
        color: white;
        transform: scale(1.05);
    }
    input[type="file"]::file-selector-button {
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
        background-color: #add8e6;
        border: 1px solid rgba(0, 0, 0, 0.16);
        transition: background-color 200ms;
    }   
    input[type="file"]::file-selector-button:hover {
        background-color: #a0c8e0;
    }
</style>

<div class="upload-documents">
    <div class="upload-container">
        <h1>Vložiť dokument</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.title.id_for_label }}">Názov:</label>
                {{ form.title }}
            </div>
            <div class="form-group">
                <label for="{{ form.file.id_for_label }}">Súbor:</label>
                {{ form.file }}
            </div>
            <div class="btn-container">
                <button type="submit" class="btn">Vložiť</button>
                <a href="{% url 'document_list' %}" class="btn">Naspäť</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
